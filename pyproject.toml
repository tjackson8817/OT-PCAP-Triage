[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-pcap-triage"
version = "2.1.0"
description = "Triage OT/ICS packet captures against known risk indicators, with severity, mitigation guidance, and MITRE ATT&CK for ICS tagging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Thomas Jackson" }]
dependencies = [
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
pdf = [
    "weasyprint>=60",
]

[project.scripts]
ot-pcap-triage = "ot_pcap_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
